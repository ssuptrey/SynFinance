apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synfinance-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: synfinance
    app.kubernetes.io/part-of: synfinance
spec:
  project: default
  source:
    repoURL: "https://github.com/ssuptrey/SynFinance.git"
    path: "helm/synfinance"
    targetRevision: HEAD
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "latest"  # ArgoCD can auto-update this
  destination:
    server: https://kubernetes.default.svc
    namespace: synfinance-production
  syncPolicy:
    automated:
      prune: true        # Deletes resources removed from Git
      selfHeal: true     # Reconciles drift automatically
    syncOptions:
      - CreateNamespace=true
