---
apiVersion: v1
kind: Secret
metadata:
  name: synfinance-secrets
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance
    app.kubernetes.io/component: secrets
    app.kubernetes.io/version: "2.15.0"
type: Opaque
stringData:
  # Database Credentials
  DATABASE_URL: "postgresql://synfinance_trey:CHANGE_ME_IN_PRODUCTION@postgres:5432/synfinance"
  POSTGRES_USER: "synfinance_trey"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "synfinance"
  
  # Redis Credentials
  REDIS_URL: "redis://:CHANGE_ME_IN_PRODUCTION@redis:6379/0"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Application Secrets
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_STRING"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_STRING"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION: "3600"
  
  # API Keys (if needed)
  API_KEY: "CHANGE_ME_IN_PRODUCTION"
  ADMIN_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  
  # Encryption Keys
  ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION_USE_32_BYTE_KEY"
  
  # Third-party integrations (if needed)
  SLACK_WEBHOOK_URL: ""
  SENTRY_DSN: ""
  DATADOG_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "synfinance_trey"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "synfinance"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
