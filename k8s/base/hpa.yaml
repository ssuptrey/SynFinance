---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synfinance-api-hpa
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance-api
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: synfinance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synfinance-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: synfinance-api-pdb
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance-api
    app.kubernetes.io/component: availability
    app.kubernetes.io/part-of: synfinance
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: synfinance-api
      app.kubernetes.io/component: api
  unhealthyPodEvictionPolicy: AlwaysAllow
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: synfinance
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: availability
    app.kubernetes.io/part-of: synfinance
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: synfinance
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: availability
    app.kubernetes.io/part-of: synfinance
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
