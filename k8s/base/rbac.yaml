---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synfinance-api
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance-api
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: synfinance
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: synfinance
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synfinance-api-role
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance-api
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synfinance-api-rolebinding
  namespace: synfinance
  labels:
    app.kubernetes.io/name: synfinance-api
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synfinance-api-role
subjects:
  - kind: ServiceAccount
    name: synfinance-api
    namespace: synfinance
