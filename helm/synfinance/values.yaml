# Default values for synfinance
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: production
  namespace: synfinance
  imageRegistry: ""
  imagePullSecrets: []

# Namespace configuration
namespace:
  create: true
  name: synfinance
  labels:
    environment: production
  annotations: {}

# API configuration
api:
  enabled: true
  name: synfinance-api
  replicaCount: 3
  
  image:
    repository: synfinance
    tag: "2.15.0"
    pullPolicy: IfNotPresent
  
  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: synfinance-api
    automountServiceAccountToken: false
  
  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  
  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8000
    metricsPort: 9090
    sessionAffinity: ClientIP
    sessionAffinityTimeout: 10800
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
      prometheus.io/path: "/metrics"
  
  # Resource limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
      ephemeral-storage: 2Gi
  
  # Probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 2
  
  startupProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTP
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 30
  
  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
  
  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  
  # Affinity rules
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - synfinance-api
            topologyKey: kubernetes.io/hostname
  
  # Node selector
  nodeSelector: {}
  
  # Tolerations
  tolerations: []
  
  # Environment variables from ConfigMap
  config:
    API_HOST: "0.0.0.0"
    API_PORT: "8000"
    API_WORKERS: "4"
    LOG_LEVEL: "INFO"
    LOG_FORMAT: "json"
    ENABLE_GRAPHQL: "true"
    ENABLE_WEBSOCKET: "true"
    ENABLE_MULTITENANCY: "true"
    ENABLE_RATE_LIMITING: "true"
    ENABLE_METRICS: "true"
    ENABLE_TRACING: "true"
    ENVIRONMENT: "production"
    DEBUG: "false"

# PostgreSQL configuration
postgres:
  enabled: true
  name: postgres
  
  image:
    repository: postgres
    tag: "14-alpine"
    pullPolicy: IfNotPresent
  
  # Service account
  serviceAccount:
    create: true
    name: postgres
    automountServiceAccountToken: false
  
  # Service configuration
  service:
    type: ClusterIP
    port: 5432
  
  # Persistence
  persistence:
    enabled: true
    storageClass: "synfinance-standard"
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  
  # Resource limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  
  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 0
  
  # Configuration
  config:
    max_connections: 200
    shared_buffers: "1GB"
    effective_cache_size: "3GB"
    work_mem: "16MB"
    maintenance_work_mem: "256MB"
  
  # Credentials (override in secrets)
  auth:
    username: synfinance_trey
    password: CHANGE_ME_IN_PRODUCTION
    database: synfinance

# Redis configuration
redis:
  enabled: true
  name: redis
  
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  
  # Service account
  serviceAccount:
    create: true
    name: redis
    automountServiceAccountToken: false
  
  # Service configuration
  service:
    type: ClusterIP
    port: 6379
  
  # Persistence
  persistence:
    enabled: true
    storageClass: "synfinance-standard"
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  
  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 0
  
  # Configuration
  config:
    maxmemory: "384mb"
    maxmemory_policy: "allkeys-lru"
    appendonly: "yes"
  
  # Credentials (override in secrets)
  auth:
    password: CHANGE_ME_IN_PRODUCTION

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  
  hosts:
    - host: api.synfinance.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.api.synfinance.com
      paths:
        - path: /
          pathType: Prefix
  
  tls:
    - secretName: synfinance-tls-cert
      hosts:
        - api.synfinance.com
        - www.api.synfinance.com

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Resource quotas
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    requests.storage: 100Gi
    limits.cpu: "50"
    limits.memory: 100Gi
    persistentvolumeclaims: "10"
    pods: "50"
    services: "20"

# Limit ranges
limitRange:
  enabled: true
  container:
    max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 50m
      memory: 128Mi
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: 500m
      memory: 1Gi

# Secrets
secrets:
  # Database URL
  databaseUrl: "postgresql://synfinance_trey:CHANGE_ME_IN_PRODUCTION@postgres:5432/synfinance"
  
  # Redis URL
  redisUrl: "redis://:CHANGE_ME_IN_PRODUCTION@redis:6379/0"
  
  # Application secrets
  secretKey: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_STRING"
  jwtSecret: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_STRING"
  jwtAlgorithm: "HS256"
  jwtExpiration: "3600"
  
  # API keys
  apiKey: "CHANGE_ME_IN_PRODUCTION"
  adminApiKey: "CHANGE_ME_IN_PRODUCTION"
  
  # Encryption
  encryptionKey: "CHANGE_ME_IN_PRODUCTION_USE_32_BYTE_KEY"

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
