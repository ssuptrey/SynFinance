{{- if .Values.api.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synfinance.api.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "synfinance.api.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.api.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.postgres.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synfinance.postgres.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "synfinance.postgres.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.postgres.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.redis.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synfinance.redis.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "synfinance.redis.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.redis.serviceAccount.automountServiceAccountToken }}
{{- end }}
